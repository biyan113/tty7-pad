# Only here so the two shared crates can inherit their settings. The app is its
# own workspace, in mobile/src-tauri.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "26.10.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"

[patch.crates-io]
simple-dns = { path = "vendor/simple-dns" }
